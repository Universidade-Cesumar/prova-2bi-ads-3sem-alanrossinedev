<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de controle - Almoxarifado</title>
</head>
<body>

    <h1>Controle de Almoxarifado</h1>

    <input
        type="text"
        id="input-nome"
        placeholder="Nome do Material">

    <input
        type="number"
        id="input-quantidade"
        placeholder="Quantidade">

    <button id="btn-cadastrar">
        Cadastrar
    </button>

    <table>
        <thead>
            <tr>
                <th>Material</th>
                <th>Quantidade</th>
            </tr>
        </thead>

        <tbody id="lista-materiais">
        </tbody>
    </table>

    <script src="script.js"></script>

</body>
</html>
