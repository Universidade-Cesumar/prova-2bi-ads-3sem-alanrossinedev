<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de controle - Almoxarifado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">
        <h1>Controle de Almoxarifado</h1>
        <p class="subtitulo">SENAC Zona Norte &mdash; Curso Técnico de Enfermagem</p>
    </header>

    <section class="painel">
        <div class="cartao-dashboard">
            <span class="dashboard-label">Total de itens cadastrados</span>
            <span id="total-itens">0</span>
        </div>

        <div class="campo-busca">
            <input
                type="text"
                id="input-busca"
                placeholder="Buscar material pelo nome...">
        </div>
    </section>

    <section class="formulario">
        <input
            type="text"
            id="input-nome"
            placeholder="Nome do Material">

        <input
            type="number"
            id="input-quantidade"
            placeholder="Quantidade">

        <button id="btn-cadastrar">
            Cadastrar
        </button>
    </section>

    <section class="formulario formulario-retirada">
        <label for="input-retirada">Quantidade a retirar:</label>
        <input
            type="number"
            id="input-retirada"
            placeholder="Qtd">
        <span class="dica-retirada">Preencha aqui e clique em "Baixar" na linha do material desejado.</span>
    </section>

    <table>
        <thead>
            <tr>
                <th>Material</th>
                <th>Quantidade</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="lista-materiais">
        </tbody>
    </table>

    <script src="main.js"></script>

</body>
</html>
